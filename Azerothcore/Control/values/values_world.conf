# ==============================================================================
# AZEROTHCORE - WORLDSERVER CONFIG VALUES
# ------------------------------------------------------------------------------
# Curated summary of worldserver.conf. Edit here, then "Apply values_world.conf"
# in worldmenu: every key below that also exists in worldserver.conf is written
# there (a timestamped backup is made first). Unknown keys are skipped.
# LoginDatabaseInfo MUST point to the AUTHSERVER LXC IP, not 127.0.0.1.
# ==============================================================================
LoginDatabaseInfo = "127.0.0.1;3306;acore;password;acore_auth"
WorldDatabaseInfo = "127.0.0.1;3306;acore;password;acore_world"
CharacterDatabaseInfo = "127.0.0.1;3306;acore;password;acore_characters"

# --- 0. SETUP ---
CharacterCreating.Disabled = 0                                              # Disables character creation completely
World.RealmAvailability = 1                                                 # Realm availability status (1 = available, 2 = maintenance)

# --- 1. GLOBAL REALM SETTINGS ---
RealmID = 1                                                                 # Realm ID from the realmlist table
BirthdayTime = 1767225600                                                   # Realm creation timestamp, currently 2026-01-01
GameType = 1                                                                # Realm type (0=Normal, 1=PvP, 2=RP, 3=RP-PvP)
RealmZone = 9                                                               # Realm language/region
Expansion = 2                                                               # Allowed expansion (0=Classic, 1=TBC, 2=WotLK)
DBC.Locale = 255                                                            # DBC file locale (255 = auto)

# --- 2. NETWORK AND PERFORMANCE ---
ProcessPriority = 0                                                         # 1 tries setpriority(-15), fails as non-root -> ERROR log line. Use Nice= in the systemd unit for a real boost.
BindIP = "0.0.0.0"                                                          # IP address the server listens on (0.0.0.0 = all interfaces)
WorldServerPort = 8085                                                      # Worldserver network port
Network.Threads = 2                                                         # CPU threads for network traffic
ThreadPool = 2                                                              # Number of IO threads
Network.EnableProxyProtocol = 0                                             # Enables proxy protocol support
Network.UseSocketActivation = 0                                             # Enables systemd socket activation

# --- 3. DATABASE CONNECTIONS AND THREADS ---
LoginDatabase.WorkerThreads = 1                                             # CPU worker threads for the login database
WorldDatabase.WorkerThreads = 4                                             # CPU worker threads for the world database
CharacterDatabase.WorkerThreads = 8                                         # CPU worker threads for the character database
LoginDatabase.SynchThreads = 1                                              # Synchronization threads for the login database
WorldDatabase.SynchThreads = 2                                              # Synchronization threads for the world database
CharacterDatabase.SynchThreads = 4                                          # Synchronization threads for the character database
PreloadAllNonInstancedMapGrids = 0                                          # 1 = loads all outdoor map grids on startup, uses a lot of RAM
DontCacheRandomMovementPaths = 0                                            # 0 = caches calculated random movement paths, 1 = recalculates paths every time
MapUpdate.Threads = 6                                                       # CPU threads reserved for map updates
MapUpdateInterval = 10                                                      # Delay in milliseconds between map update cycles
MinWorldUpdateTime = 1                                                      # Minimum server tick duration in milliseconds before the main loop continues
RecordUpdateTimeDiffInterval = 60000                                        # How often the server writes its update-time report (default 300000 = every 5 min)
MinRecordUpdateTimeDiff = 0                                                 # Report even when the tick was fast (default 100 = only above 100 ms)

# --- 4. SYSTEM PATHS, LOGGING AND INTERFACES ---
DataDir = "."                                                               # Path to the data directory containing DBCs and maps
LogsDir = ""                                                                # Path for log files
Appender.Console = 1,4,0,"1 9 3 6 5 8"                                      # Console log formatting: type,level,flags,colors
Appender.Server=2,5,1,Server.log,w                                          # File appender for Server.log; flag 1 = timestamp per line
SOAP.Enabled = 1                                                            # Enables the SOAP interface for web tools
SOAP.IP = "127.0.0.1"                                                       # SOAP bind IP
SOAP.Port = 7878                                                            # SOAP port
Appender.Playerbots=2,4,1,Playerbots.log,w                                  # File appender for Playerbots activity logs
Logger.playerbots=4,Console Playerbots                                      # Shows general bot actions live in the tmux console
AutoBroadcast.On = 0                                                        # Disables automatic timed server chat messages

# --- 5. CHARACTER CREATION AND RESTRICTIONS ---
CharactersPerAccount = 50                                                   # Maximum characters per account (AC cap: 50)
CharactersPerRealm = 10                                                     # Maximum characters per realm (AC validates 1..10)
HeroicCharactersPerRealm = 10                                               # Maximum Death Knights per realm
CharacterCreating.MinLevelForHeroicCharacter = 55                           # Required level for Death Knight creation
CleanCharacterDB = 1                                                        # Cleans unused database entries on startup
PersistentCharacterCleanFlags = 14                                          # Persistent character cleanup flags

# --- 6. CHARACTER START OPTIONS AND COMFORT ---
StartPlayerLevel = 1                                                        # Starting level for normal characters
StartHeroicPlayerLevel = 55                                                 # Starting level for Death Knights
StartPlayerMoney = 0                                                        # Starting money for normal characters, in copper
StartHeroicPlayerMoney = 2000                                               # Starting money for Death Knights, in copper
PlayerStart.AllReputation = 0                                               # Starting reputation with all factions
PlayerStart.MapsExplored = 0                                                # Unlocks the entire world map immediately
AllFlightPaths = 0                                                          # Unlocks all flight paths immediately
InstantFlightPaths = 0                                                      # Makes flight connections instant
LeaveGroupOnLogout.Enabled = 1                                              # Removes bots/players from groups immediately on logout

# --- 7. PLAYER LIMITS AND BEHAVIOR ---
PlayerLimit = 0                                                             # Maximum number of simultaneous players
PreventAFKLogout = 0                                                        # Prevents AFK logout
Server.LoginInfo = 0                                                        # Shows server information on login
MaxWhoListReturns = 10000                                                   # Maximum results for /who searches

# --- 8. CHARACTER SAVING AND DELETION ---
PlayerSaveInterval = 600000                                                 # Character save interval in milliseconds
PlayerSave.Stats.MinLevel = 0                                               # Minimum level for detailed statistics saving
PlayerSave.Stats.SaveOnlyOnLogout = 1                                       # Saves statistics only on logout
PlayerSave.AdditionalSaves = 4                                              # Saves achievements a few seconds after completion (portal live ticker)
CharDelete.Method = 0                                                       # Delete method (0 = delete completely, 1 = keep in database)
CharDelete.KeepDays = 30                                                    # Retention time for deleted characters when method 1 is used

# --- 9. LEVELING, RATES AND SPECIALIZATION ---
MaxPlayerLevel = 80                                                         # Maximum reachable player level
MinDualSpecLevel = 40                                                       # Minimum level for dual talent specialization
Rate.XP.Kill = 1                                                            # XP rate for kills
Rate.XP.Quest = 1                                                           # XP rate for quests
Rate.XP.Quest.DF = 1                                                        # XP rate for Dungeon Finder quests
Rate.XP.Explore = 1                                                         # XP rate for exploration
Rate.XP.Pet = 1                                                             # XP rate for Hunter pets

# --- 10. INTERACTIONS AND PERMISSIONS ---
LevelReq.Trade = 10                                                         # Minimum level for trading
LevelReq.Mail = 10                                                          # Minimum level for using mail
MailDeliveryDelay = 10                                                      # Mail delivery delay between players, in seconds
AllowPlayerCommands = 1                                                     # Allows players to use basic commands
TalentsInspecting = 1                                                       # Allows inspecting other players' talents

# --- 11. IN-GAME TICKETS ---
AllowTickets = 1                                                            # Allows players to create GM tickets
LevelReq.Ticket = 1                                                         # Minimum level for ticket creation

# --- 12. GM SETTINGS ---
GM.LoginState = 0                                                           # GM state on login (0=normal player, 2=GM mode)
GM.Visible = 2                                                              # GM visibility on startup (0=invisible, 2=visible)
GM.Chat = 0                                                                 # GM chat state on startup
GM.WhisperingTo = 1                                                         # GM whisper mode on startup
GM.StartLevel = 1                                                           # Starting security level for new GMs
ShowKickInWorld = 1                                                         # Shows kicks globally in chat
ShowMuteInWorld = 1                                                         # Shows mutes globally in chat
ShowBanInWorld = 0                                                          # Shows bans globally in chat

# --- 13. INSTANCES AND DUNGEON FINDER ---
Instance.ResetTimeHour = 6                                                  # Daily instance reset hour
Rate.InstanceResetTime = 1                                                  # Multiplier for instance ID durations
AccountInstancesPerHour = 10                                                # Maximum instance entries per hour per account

# --- 14. GUILDS ---
Guild.BankInitialTabs = 0                                                   # Number of guild bank tabs unlocked by default
Guild.MemberLimit = 100                                                     # Maximum guild member limit

# --- 15. CROSS-FACTION ---
AllowTwoSide.Accounts = 1                                                   # Allows Alliance and Horde characters on one PvP account
AllowTwoSide.WhoList = 1                                                    # Shows Alliance and Horde in the /who list
AllowTwoSide.Interaction.Chat = 1                                           # Enables cross-faction whisper and chat
AllowTwoSide.Interaction.Channel = 1                                        # Enables cross-faction standard chat channels
AllowTwoSide.Interaction.Group = 1                                          # Enables cross-faction grouping
AllowTwoSide.Interaction.Guild = 1                                          # Enables cross-faction guilds
AllowTwoSide.Interaction.Arena = 1                                          # Enables cross-faction arena teams
AllowTwoSide.Interaction.Auction = 1                                        # Enables cross-faction auction house
AllowTwoSide.Interaction.Calendar = 1                                       # Enables cross-faction calendar invites

# --- 16. AUCTION HOUSE ---
AuctionHouse.WorkerThreads = 2                                              # CPU threads for the auction house
LevelReq.Auction = 10                                                       # Minimum level for auction house usage

# --- 17. SECURITY AND WEATHER ---
Warden.Enabled = 1                                                          # Enables Blizzard Warden anti-cheat
ActivateWeather = 1                                                         # Enables the weather system
