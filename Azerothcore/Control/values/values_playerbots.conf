# ==============================================================================
# AZEROTHCORE - PLAYERBOTS MODULE CONFIG VALUES
# ------------------------------------------------------------------------------
# Curated summary of playerbots.conf. Edit here, then "Apply values_playerbots"
# in worldmenu: every key below that also exists in playerbots.conf is written
# there (a timestamped backup is made first). Unknown keys are skipped.
# ==============================================================================
PlayerbotsDatabaseInfo = "127.0.0.1;3306;acore;password;acore_playerbots"

# --- 1. DELETE AND CLEANUP COMMANDS ---
AiPlayerbot.DeleteRandomBotAccounts = 0                                     # Deletes unused random bot accounts on server startup (1 = enabled)
AiPlayerbot.DeleteRandomBotGuilds = 0                                       # Deletes empty or inactive bot guilds (1 = enabled)
AiPlayerbot.DeleteRandomBotArenaTeams = 0                                   # Deletes all existing bot arena teams on server startup (1 = enabled)

# --- 2. BASIC ENABLEMENT AND BOT COUNT ---
AiPlayerbot.Enabled = 1                                                     # Enables the Playerbots module (1 = yes, 0 = no)
AiPlayerbot.RandomBotAutologin = 1                                          # Enables automatic login for random bots
AiPlayerbot.MinRandomBots = 500                                             # Active random bots; grow in steps and restart between - each jump is generated at boot
AiPlayerbot.MaxRandomBots = 999                                             # 200 ~= a lively small server; raise only if the box has the RAM/cores for it
AiPlayerbot.RandomBotAccountCount = 0                                       # Limit for created bot accounts (0 = unlimited) Double Bots of MaxRandomBots
AiPlayerbot.DisableRandomLevels = 1                                         # Disables random level assignment (1 = all bots use the starting level)

# --- 3. THREADS ---
PlayerbotsDatabase.WorkerThreads = 2                                        # CPU worker threads for the Playerbots database
Playerbots.Updates.EnableDatabases = 1                                      # Allows the module to apply database updates automatically

# --- 4. PLAYER PRESENCE CONTROL AND SMART SCALING ---
AiPlayerbot.DisabledWithoutRealPlayer = 0                                   # Fully disables bots when no real player is online (1 = yes)
AiPlayerbot.DisabledWithoutRealPlayerLoginDelay = 30                        # Delay in seconds before bots log in after a player login
AiPlayerbot.DisabledWithoutRealPlayerLogoutDelay = 300                      # Delay in seconds before bots log out after a player logout
AiPlayerbot.botActiveAloneSmartScale = 1                                    # Enables dynamic bot density around real players
AiPlayerbot.botActiveAloneSmartScaleDiffLimitfloor = 50                     # Minimum bot count for smart scaling logic
AiPlayerbot.botActiveAloneSmartScaleDiffLimitCeiling = 200                  # Maximum bot count for smart scaling logic
AiPlayerbot.botActiveAloneSmartScaleWhenMinLevel = 1                        # Minimum level where smart scaling applies
AiPlayerbot.botActiveAloneSmartScaleWhenMaxLevel = 80                       # Maximum level where smart scaling applies
AiPlayerbot.BotActiveAlone = 100                                            # Maximum number of bots active alone without real players nearby
AiPlayerbot.BotActiveAloneDurationSeconds = 30                              # Time in seconds before a lonely bot is put to sleep or despawned

# --- 5. PERMISSIONS, INTERACTIONS AND ACCOUNTS ---
AiPlayerbot.MaxAddedBots = 40                                               # Maximum number of bots a player can summon manually
AiPlayerbot.AllowAccountBots = 0                                            # Allows loading characters from the own account as bots
AiPlayerbot.AllowGuildBots = 1                                              # Allows guild members to use guild bots
AiPlayerbot.RandomBotInvitePlayer = 1                                       # Allows random bots to actively invite real players to groups

# --- 6. LEVEL RULES AND PROGRESSION ---
AiPlayerbot.RandomBotMinLevel = 1                                           # Minimum level a random bot can have
AiPlayerbot.RandomBotMaxLevel = 80                                          # Maximum level a random bot can have
AiPlayerbot.RandombotStartingLevel = 1                                      # Starting level for new random bots when fixed starting levels are enabled
AiPlayerbot.RandomBotMinLevelChance = 0.1                                   # Chance that a bot keeps the minimum level
AiPlayerbot.RandomBotMaxLevelChance = 0.1                                   # Chance that a bot reaches the maximum level
AiPlayerbot.RandomBotXPRate = 1.0                                           # Experience multiplier for bots
AiPlayerbot.SyncLevelWithPlayers = 0                                        # Dynamically syncs bot level with real player level
AiPlayerbot.LimitTalentsExpansion = 0                                       # Limits bot talents to the current expansion

# --- 7. GEAR AND LOOT ---
AiPlayerbot.AutoGearQualityLimit = 3                                        # Maximum item quality for auto gear (3 = rare/blue)
AiPlayerbot.AutoGearScoreLimit = 1                                          # GearScore-based limit (0 = disabled)
AiPlayerbot.GearScoreCheck = 1                                              # Enables strict GearScore checks for instances
AiPlayerbot.RandomBotShowHelmet = 1                                         # Shows helmets on random bots (0 = hide)
AiPlayerbot.RandomBotShowCloak = 1                                          # Shows cloaks on random bots (0 = hide)
AiPlayerbot.FreeMethodLoot = 0                                              # Loot method for bots (0 = default rolling)
AiPlayerbot.LootNeedRollLevel = 1                                           # Roll priority for Need on matching items
AiPlayerbot.LootGreedRollLevel = 1                                          # Roll priority for Greed
AiPlayerbot.LootRollRecipe = 1                                              # Allows bots to roll on profession recipes
AiPlayerbot.LootRollDisenchant = 1                                          # Allows bots to choose Disenchant while looting

# --- 8. MOVEMENT, TRAVEL AND MOUNTS ---
AiPlayerbot.UseGroundMountAtMinLevel = 20                                   # Minimum level for normal ground mount (60%)
AiPlayerbot.UseFastGroundMountAtMinLevel = 40                               # Minimum level for fast ground mount (100%)
AiPlayerbot.UseFlyMountAtMinLevel = 60                                      # Minimum level for normal flying mount (150%)
AiPlayerbot.UseFastFlyMountAtMinLevel = 70                                  # Minimum level for fast flying mount (280%/310%)
AiPlayerbot.RandomBotMaps = 0,1,530,571                                     # Map IDs where bots may stay (0=Eastern Kingdoms, 1=Kalimdor, 530=Outland, 571=Northrend)
AiPlayerbot.RandomBotTeleportDistance = 400                                 # Maximum teleport distance for bot activities
AiPlayerbot.RandomBotTeleLowerLevel = 1                                     # Lower level range for zone teleports
AiPlayerbot.RandomBotTeleHigherLevel = 3                                    # Upper level range for zone teleports
AiPlayerbot.AutoTeleportForLevel = 1                                        # Automatically teleports bots to zones suitable for their level

# --- 9. CITIES, BANKERS AND RPG BEHAVIOR ---
AiPlayerbot.ProbTeleToBankers = 0.30                                        # Chance that a bot teleports to a banker (0.00 - 1.00)
AiPlayerbot.EnableWeightTeleToCityBankers = 1                               # Enables weighted distribution across capital cities

# --- TIER 1: Main capitals with maximum bot density ---
AiPlayerbot.TeleToStormwindWeight = 25                                      # Very high: Main Alliance hub
AiPlayerbot.TeleToOrgrimmarWeight = 25                                      # Very high: Main Horde hub
AiPlayerbot.TeleToDalaranWeight = 25                                        # Very high: Neutral WotLK hotspot

# --- TIER 2: Popular secondary cities with medium bot density ---
AiPlayerbot.TeleToIronforgeWeight = 10                                      # Medium: Traditionally active Dwarf city
AiPlayerbot.TeleToUndercityWeight = 10                                      # Medium: Active but manageable Undead city
AiPlayerbot.TeleToShattrathCityWeight = 10                                  # Medium: Old TBC hub with moderate activity

# --- TIER 3: Quiet outer cities with slightly increased density ---
AiPlayerbot.TeleToDarnassusWeight = 5                                       # Slightly increased: Night Elf city with basic activity
AiPlayerbot.TeleToExodarWeight = 5                                          # Slightly increased: Draenei home city, less empty
AiPlayerbot.TeleToThunderBluffWeight = 5                                    # Slightly increased: Tauren home city feels more alive
AiPlayerbot.TeleToSilvermoonCityWeight = 5                                  # Slightly increased: Blood Elf metropolis with more activity

AiPlayerbot.RandomBotRpgChance = 0.30                                       # Chance for idle roleplay actions in cities
AiPlayerbot.RpgStatusProbWeight.TravelFlight = 20                           # Priority for flight travel

# --- 10. QUESTS AND DUNGEONS (LFG) ---
AiPlayerbot.AutoDoQuests = 1                                                # Bots accept and complete world quests automatically
AiPlayerbot.SyncQuestWithPlayer = 1                                         # Syncs bot quest progress with the player
AiPlayerbot.SyncQuestForPlayer = 1                                          # Syncs player quest progress with the bot
AiPlayerbot.PreQuests = 0                                                   # Forces bots to respect prerequisite quests for instances/zones
AiPlayerbot.RandomBotJoinLfg = 1                                            # Allows random bots to queue for Dungeon Finder (LFG)
AiPlayerbot.RandomBotSuggestDungeons = 1                                    # Bots suggest suitable dungeons to the group leader
AiPlayerbot.AutoLearnQuestSpells = 1                                        # Bots automatically learn quest-unlocked spells
AiPlayerbot.AutoLearnTrainerSpells = 1                                      # Bots automatically learn all trainer spells

# --- 11. GUILDS, FACTIONS AND CLASS RESTRICTIONS ---
AiPlayerbot.RandomBotAllianceRatio = 50                                     # Percentage of Alliance bots in the pool
AiPlayerbot.RandomBotHordeRatio = 50                                        # Percentage of Horde bots in the pool
AiPlayerbot.RandomBotGuildNearby = 0                                        # Creates guilds only near real players
AiPlayerbot.RandomBotGuildCount = 50                                        # Maximum number of bot-only guilds on the realm
AiPlayerbot.RandomBotGuildSizeMax = 50                                      # Maximum member count per bot guild
AiPlayerbot.EnableGuildTasks = 1                                            # Enables the guild task system for bots
AiPlayerbot.DisableDeathKnightLogin = 1                                     # Prevents Death Knight bots from logging in (1 = blocked)

# --- 12. ARENA AND PVP TEAMS ---
AiPlayerbot.RandomBotArenaTeam2v2Count = 30                                 # Number of 2v2 arena teams to create
AiPlayerbot.RandomBotArenaTeam3v3Count = 30                                 # Number of 3v3 arena teams to create
AiPlayerbot.RandomBotArenaTeam5v5Count = 10                                 # Number of 5v5 arena teams to create
AiPlayerbot.RandomBotArenaTeamMinRating = 0                                 # Minimum random start rating for bot arena teams
AiPlayerbot.RandomBotArenaTeamMaxRating = 2000                              # Maximum random start rating for bot arena teams
AiPlayerbot.RandomBotJoinBG = 1                                             # Allows random bots to join battlegrounds manually or via commands
AiPlayerbot.RandomBotAutoJoinBG = 1                                         # Bots automatically join battlegrounds in the background when a BG starts

# --- 13. PERFORMANCE, TICK RATES AND NETWORK ---
AiPlayerbot.IterationsPerTick = 1000                                        # Number of calculation steps per server tick per bot
AiPlayerbot.MaxMovementSearchTime = 3                                       # Maximum pathfinding time in seconds
AiPlayerbot.ReactDelay = 400                                                # Base bot reaction delay in combat, in milliseconds
AiPlayerbot.DynamicReactDelay = 1                                           # Enables dynamic reaction delays based on server latency
AiPlayerbot.PassiveDelay = 5000                                             # Delay for actions in passive mode, in milliseconds
AiPlayerbot.RepeatDelay = 120000                                            # Delay for repeated checks, in milliseconds
AiPlayerbot.CommandServerPort = 8888                                        # Network port for external bot control commands
AiPlayerbot.PerfMonEnabled = 1                                              # Enables the bot performance monitoring tool
AiPlayerbot.RandomBotRandomPassword = 1                                     # Generates random passwords for bot accounts
AiPlayerbot.RandomBotAccountPrefix = "BOT_Acc_"                             # Prefix for automatically generated bot accounts

# --- 14. CHAT AND SOCIAL FEATURES ---
AiPlayerbot.RandomBotTalk = 1                                               # Enables random bot speech in say, general or trade chat
AiPlayerbot.RandomBotEmote = 0                                              # Random bot emotes such as waving or dancing (module default: off)
AiPlayerbot.EnableGreet = 0                                                 # Bots greet players when invited
AiPlayerbot.GuildRepliesRate = 10                                           # Chance in percent that bots chat in guild about events (default 100)
AIPlayerbot.GuildFeedback = 1                                               # Enables bot feedback in guild chat for events such as achievements or loot
AiPlayerbot.RandomBotSayWithoutMaster = 0                                   # Bots stay silent when traveling without a real player master

# --- 15. BROADCASTS ---
AiPlayerbot.EnableBroadcasts = 1                                            # Enables or disables all automatic bot chat broadcasts
AiPlayerbot.BroadcastChanceGuildManagement = 3000                           # Guild management messages; independent of the global chance below
AiPlayerbot.BroadcastToWorldGlobalChance = 3000                             # World chat
AiPlayerbot.BroadcastToGuildGlobalChance = 3000                             # Guild chat
AiPlayerbot.BroadcastToGeneralGlobalChance = 3000                           # Local zone chat
AiPlayerbot.BroadcastToTradeGlobalChance = 3000                             # Trade chat
AiPlayerbot.BroadcastToLFGGlobalChance = 3000                               # LFG chat
AiPlayerbot.BroadcastToLocalDefenseGlobalChance = 3000                      # Local defense
AiPlayerbot.BroadcastToWorldDefenseGlobalChance = 3000                      # World defense
AiPlayerbot.BroadcastToGuildRecruitmentGlobalChance = 3000                  # Guild recruitment

# --- 16. TIME INTERVALS AND BOT ROTATION ---
AiPlayerbot.MaxWaitForMove = 300                                            # Maximum wait time in milliseconds before a bot aborts blocked movement
AiPlayerbot.GlobalCooldown = 300                                            # Artificial delay in milliseconds between bot spells
AiPlayerbot.RandomBotUpdateInterval = 20                                    # Interval in seconds for general random bot pool updates (module default)
AiPlayerbot.RandomBotCountChangeMinInterval = 300                           # Minimum time in seconds before bot count changes
AiPlayerbot.RandomBotCountChangeMaxInterval = 1200                          # Maximum time in seconds before bot count changes
AiPlayerbot.MinRandomBotInWorldTime = 600                                   # Minimum time in seconds a bot must stay online
AiPlayerbot.MaxRandomBotInWorldTime = 3600                                  # Maximum time in seconds a bot may stay online (1 h; with Min=600 the pool swaps constantly)
AiPlayerbot.MinRandomBotRandomizeTime = 7200                                # Minimum time in seconds before bot properties are randomized again
AiPlayerbot.MaxRandomBotRandomizeTime = 1209600                             # Maximum time in seconds before bot properties are randomized again
AiPlayerbot.MinRandomBotTeleportInterval = 1300                             # Minimum time in seconds before an inactive bot teleports to a new location
AiPlayerbot.MaxRandomBotTeleportInterval = 12000                            # Maximum time in seconds before an inactive bot must teleport
AiPlayerbot.RandomBotsPerInterval = 50                                      # Number of bots logged in or out per interval
AiPlayerbot.PermanentlyInWorldTime = 31104000                               # Time value in seconds for bots that should remain permanently online
AiPlayerbot.EnablePeriodicOnlineOffline = 1                                 # Enables periodic online/offline phases to simulate peak times
AiPlayerbot.PeriodicOnlineOfflineRatio = 1.5                                # Total pool / online bots - 2.0 = twice MaxRandomBots exist, half of them online and rotating
AiPlayerbot.BotCheats = "food,raid,taxi"                                    # Enabled in-game cheats for bots
