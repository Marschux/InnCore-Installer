# ==============================================================================
# AZEROTHCORE - PLAYERBOTS MODULE CONFIG VALUES
# ------------------------------------------------------------------------------
# Curated summary of playerbots.conf. Edit here, then "Apply values_playerbots"
# in worldmenu: every key below that also exists in playerbots.conf is written
# there (a timestamped backup is made first). Unknown keys are skipped.
# ==============================================================================
PlayerbotsDatabaseInfo = "127.0.0.1;3306;acore;password;acore_playerbots"

# --- 1. DELETE AND CLEANUP COMMANDS ---
AiPlayerbot.DeleteRandomBotAccounts = 0                                     # Deletes unused random bot accounts on server startup
AiPlayerbot.DeleteRandomBotGuilds = 0                                       # Deletes empty or inactive bot guilds
AiPlayerbot.DeleteRandomBotArenaTeams = 0                                   # Deletes all existing bot arena teams on server startup

# --- 2. BASIC ENABLEMENT AND BOT COUNT ---
AiPlayerbot.Enabled = 1                                                     # Enables the Playerbots module
AiPlayerbot.RandomBotAutologin = 1                                          # Enables automatic login for random bots
AiPlayerbot.MinRandomBots = 150                                             # Active random bots; grow in steps and restart between - each jump is generated at boot
AiPlayerbot.MaxRandomBots = 200                                             # 200 ~= a lively small server; raise only if the box has the RAM/cores for it
AiPlayerbot.RandomBotAccountCount = 0                                       # Limit for created bot accounts (0 = unlimited)
AiPlayerbot.DisableRandomLevels = 1                                         # Disables random level assignment

# --- 3. THREADS ---
PlayerbotsDatabase.WorkerThreads = 2                                        # CPU worker threads for the Playerbots database
PlayerbotsDatabase.SynchThreads = 1                                         # Synchronization threads for the Playerbots database
Playerbots.Updates.EnableDatabases = 1                                      # Allows the module to apply database updates automatically

# --- 4. PLAYER PRESENCE CONTROL AND SMART SCALING ---
AiPlayerbot.DisabledWithoutRealPlayer = 0                                   # Fully disables bots when no real player is online
AiPlayerbot.botActiveAloneSmartScale = 1                                    # Enables dynamic bot density around real players
AiPlayerbot.botActiveAloneSmartScaleDiffLimitfloor = 50                     # Minimum bot count for smart scaling logic
AiPlayerbot.botActiveAloneSmartScaleDiffLimitCeiling = 200                  # Maximum bot count for smart scaling logic
AiPlayerbot.BotActiveAlone = 100                                            # Maximum number of bots active alone without real players nearby

# --- 5. PERMISSIONS AND ACCOUNTS ---
AiPlayerbot.MaxAddedBots = 40                                               # Maximum number of bots a player can summon manually
AiPlayerbot.AddClassCommand = 1                                             # Allows creating bots with the .bot add [class] command
AiPlayerbot.AddClassAccountPoolSize = 50                                    # Account pool size for manually created class bots
AiPlayerbot.RandomBotInvitePlayer = 1                                       # Allows random bots to actively invite real players to groups

# --- 6. LEVEL RULES AND PROGRESSION ---
AiPlayerbot.RandomBotMinLevel = 1                                           # Minimum level a random bot can have
AiPlayerbot.RandomBotMaxLevel = 80                                          # Maximum level a random bot can have
AiPlayerbot.RandombotStartingLevel = 1                                      # Starting level for new random bots
AiPlayerbot.RandomBotXPRate = 1.0                                           # Experience multiplier for bots
AiPlayerbot.SyncLevelWithPlayers = 0                                        # Dynamically syncs bot level with real player level

# --- 7. GEAR AND LOOT ---
AiPlayerbot.AutoGearCommand = 1                                             # Enables the automatic gear command (.bot gear)
AiPlayerbot.AutoUpgradeEquip = 1                                            # Bots automatically equip found upgrades
AiPlayerbot.AutoGearQualityLimit = 3                                        # Maximum item quality for auto gear (3 = rare/blue)
AiPlayerbot.RandomBotShowHelmet = 1                                         # Shows helmets on random bots
AiPlayerbot.RandomBotShowCloak = 1                                          # Shows cloaks on random bots

# --- 8. MOVEMENT, TRAVEL AND MOUNTS ---
AiPlayerbot.UseGroundMountAtMinLevel = 20                                   # Minimum level for normal ground mount
AiPlayerbot.UseFastGroundMountAtMinLevel = 40                              # Minimum level for fast ground mount
AiPlayerbot.UseFlyMountAtMinLevel = 60                                     # Minimum level for normal flying mount
AiPlayerbot.UseFastFlyMountAtMinLevel = 70                                # Minimum level for fast flying mount
AiPlayerbot.RandomBotMaps = 0,1,530,571                                     # Map IDs where bots may stay (0=EK, 1=Kalimdor, 530=Outland, 571=Northrend)
AiPlayerbot.AutoTeleportForLevel = 1                                        # Automatically teleports bots to zones suitable for their level

# --- 9. QUESTS AND DUNGEONS (LFG) ---
AiPlayerbot.AutoDoQuests = 1                                                # Bots accept and complete world quests automatically
AiPlayerbot.SyncQuestWithPlayer = 1                                         # Syncs bot quest progress with the player
AiPlayerbot.RandomBotJoinLfg = 1                                            # Allows random bots to queue for Dungeon Finder
AiPlayerbot.AutoLearnQuestSpells = 1                                        # Bots automatically learn quest-unlocked spells
AiPlayerbot.AutoLearnTrainerSpells = 1                                      # Bots automatically learn all trainer spells
AiPlayerbot.AutoPickTalents = 1                                             # Bots automatically choose their talents

# --- 10. FACTIONS AND CLASS RESTRICTIONS ---
AiPlayerbot.RandomBotAllianceRatio = 50                                     # Percentage of Alliance bots in the pool
AiPlayerbot.RandomBotHordeRatio = 50                                        # Percentage of Horde bots in the pool
AiPlayerbot.RandomBotGuildCount = 50                                        # Maximum number of bot-only guilds on the realm
AiPlayerbot.DisableDeathKnightLogin = 1                                     # Prevents Death Knight bots from logging in

# --- 11. PERFORMANCE, TICK RATES AND NETWORK ---
AiPlayerbot.IterationsPerTick = 1000                                        # Number of calculation steps per server tick per bot
AiPlayerbot.ReactDelay = 400                                                # Base bot reaction delay in combat, in milliseconds
AiPlayerbot.DynamicReactDelay = 1                                           # Enables dynamic reaction delays based on server latency
AiPlayerbot.CommandServerPort = 8888                                        # Network port for external bot control commands

# --- 12. CHAT AND SOCIAL FEATURES ---
AiPlayerbot.RandomBotTalk = 1                                               # Enables random bot speech in say, general or trade chat
AiPlayerbot.RandomBotEmote = 1                                              # Enables random bot emotes
AiPlayerbot.EnableGreet = 1                                                 # Allows bots to greet players they meet
AiPlayerbot.EnableBroadcasts = 1                                            # Enables or disables all automatic bot chat broadcasts

# --- 13. BOT ROTATION ---
AiPlayerbot.RandomBotUpdateInterval = 30                                    # Interval in seconds for general random bot pool updates
AiPlayerbot.RandomBotsPerInterval = 50                                      # Number of bots logged in or out per interval
AiPlayerbot.BotCheats = "food,raid,taxi"                                    # Enabled in-game cheats for bots
