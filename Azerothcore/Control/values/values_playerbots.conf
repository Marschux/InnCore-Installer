# ==============================================================================
# AZEROTHCORE - PLAYERBOTS MODULE CONFIG VALUES
# ------------------------------------------------------------------------------
# Curated summary of playerbots.conf. Edit here, then "Apply values_playerbots"
# in worldmenu: every key below that also exists in playerbots.conf is written
# there (a timestamped backup is made first). Unknown keys are skipped.
# ==============================================================================
PlayerbotsDatabaseInfo = "127.0.0.1;3306;acore;password;acore_playerbots"

# --- 1. DELETE AND CLEANUP COMMANDS ---
Playerbots.DeleteRandomBotAccounts = 0                                     # Deletes unused random bot accounts on server startup (1 = enabled)
Playerbots.DeleteRandomBotGuilds = 0                                       # Deletes empty or inactive bot guilds (1 = enabled)
Playerbots.DeleteRandomBotArenaTeams = 0                                   # Deletes all existing bot arena teams on server startup (1 = enabled)

# --- 2. BASIC ENABLEMENT AND BOT COUNT ---
Playerbots.Enabled = 1                                                     # Enables the Playerbots module (1 = yes, 0 = no)
Playerbots.RandomBotAutologin = 1                                          # Enables automatic login for random bots
Playerbots.MinRandomBots = 0                                               # Lower end of the random bot count (see RandomBotCountMode)
Playerbots.MaxRandomBots = 0                                               # Upper end; raise in steps with a restart between - every new bot is generated at boot
Playerbots.RandomBotAccountCount = 0                                       # Bot accounts to create (0 = automatic: enough for MaxRandomBots)
Playerbots.DisableRandomLevels = 1                                         # Disables random level assignment (1 = all bots use the starting level)

# --- 3. THREADS ---
PlayerbotsDatabase.WorkerThreads = 2                                        # CPU worker threads for the Playerbots database
Playerbots.Updates.EnableDatabases = 1                                      # Allows the module to apply database updates automatically

# --- 4. PLAYER PRESENCE CONTROL AND SMART SCALING ---
Playerbots.DisabledWithoutRealPlayer = 0                                   # Fully disables bots when no real player is online (1 = yes)
Playerbots.DisabledWithoutRealPlayerLoginDelay = 30                        # Delay in seconds before bots log in after a player login
Playerbots.DisabledWithoutRealPlayerLogoutDelay = 300                      # Delay in seconds before bots log out after a player logout
Playerbots.botActiveAloneSmartScale = 1                                    # Enables dynamic bot density around real players
Playerbots.botActiveAloneSmartScaleDiffLimitfloor = 50                     # Minimum bot count for smart scaling logic
Playerbots.botActiveAloneSmartScaleDiffLimitCeiling = 200                  # Maximum bot count for smart scaling logic
Playerbots.botActiveAloneSmartScaleWhenMinLevel = 1                        # Minimum level where smart scaling applies
Playerbots.botActiveAloneSmartScaleWhenMaxLevel = 80                       # Maximum level where smart scaling applies
Playerbots.BotActiveAlone = 100                                            # Maximum number of bots active alone without real players nearby
Playerbots.BotActiveAloneDurationSeconds = 30                              # Time in seconds before a lonely bot is put to sleep or despawned

# --- 5. PERMISSIONS, INTERACTIONS AND ACCOUNTS ---
Playerbots.MaxAddedBots = 40                                               # Maximum number of bots a player can summon manually
Playerbots.AllowAccountBots = 0                                            # Allows loading characters from the own account as bots
Playerbots.AllowGuildBots = 1                                              # Allows guild members to use guild bots
Playerbots.RandomBotInvitePlayer = 1                                       # Allows random bots to actively invite real players to groups

# --- 6. LEVEL RULES AND PROGRESSION ---
Playerbots.RandomBotMinLevel = 1                                           # Minimum level a random bot can have
Playerbots.RandomBotMaxLevel = 80                                          # Maximum level a random bot can have
Playerbots.RandombotStartingLevel = 1                                      # Starting level for new random bots when fixed starting levels are enabled
Playerbots.RandomBotMinLevelChance = 0.1                                   # Chance that a bot keeps the minimum level
Playerbots.RandomBotMaxLevelChance = 0.1                                   # Chance that a bot reaches the maximum level
Playerbots.RandomBotXPRate = 1.0                                           # Experience multiplier for bots
Playerbots.SyncLevelWithPlayers = 0                                        # Dynamically syncs bot level with real player level
Playerbots.LimitTalentsExpansion = 0                                       # Limits bot talents to the current expansion

# --- 7. GEAR AND LOOT ---
Playerbots.AutoGearQualityLimit = 3                                        # Maximum item quality for auto gear (3 = rare/blue)
Playerbots.AutoGearScoreLimit = 0                                          # Max item level for "autogear bis" (0 = no limit; 1 capped bots at ilvl 1)
Playerbots.GearScoreCheck = 1                                              # Enables strict GearScore checks for instances
Playerbots.RandomBotShowHelmet = 1                                         # Shows helmets on random bots (0 = hide)
Playerbots.RandomBotShowCloak = 1                                          # Shows cloaks on random bots (0 = hide)
Playerbots.FreeMethodLoot = 0                                              # Loot method for bots (0 = default rolling)
Playerbots.LootNeedRollLevel = 1                                           # Roll priority for Need on matching items
Playerbots.LootGreedRollLevel = 1                                          # Roll priority for Greed
Playerbots.LootRollRecipe = 1                                              # Allows bots to roll on profession recipes
Playerbots.LootRollDisenchant = 1                                          # Allows bots to choose Disenchant while looting

# --- 8. MOVEMENT, TRAVEL AND MOUNTS ---
Playerbots.UseGroundMountAtMinLevel = 20                                   # Minimum level for normal ground mount (60%)
Playerbots.UseFastGroundMountAtMinLevel = 40                               # Minimum level for fast ground mount (100%)
Playerbots.UseFlyMountAtMinLevel = 60                                      # Minimum level for normal flying mount (150%)
Playerbots.UseFastFlyMountAtMinLevel = 70                                  # Minimum level for fast flying mount (280%/310%)
Playerbots.RandomBotMaps = 0,1,530,571                                     # Map IDs where bots may stay (0=Eastern Kingdoms, 1=Kalimdor, 530=Outland, 571=Northrend)
Playerbots.RandomBotTeleportDistance = 400                                 # Maximum teleport distance for bot activities
Playerbots.RandomBotTeleLowerLevel = 1                                     # Lower level range for zone teleports
Playerbots.RandomBotTeleHigherLevel = 3                                    # Upper level range for zone teleports
Playerbots.AutoTeleportForLevel = 1                                        # Automatically teleports bots to zones suitable for their level

# --- 9. CITIES, BANKERS AND RPG BEHAVIOR ---
Playerbots.ProbTeleToBankers = 0.30                                        # Chance that a bot teleports to a banker (0.00 - 1.00)
Playerbots.EnableWeightTeleToCityBankers = 1                               # Enables weighted distribution across capital cities

# --- TIER 1: Main capitals with maximum bot density ---
Playerbots.TeleToStormwindWeight = 25                                      # Very high: Main Alliance hub
Playerbots.TeleToOrgrimmarWeight = 25                                      # Very high: Main Horde hub
Playerbots.TeleToDalaranWeight = 25                                        # Very high: Neutral WotLK hotspot

# --- TIER 2: Popular secondary cities with medium bot density ---
Playerbots.TeleToIronforgeWeight = 10                                      # Medium: Traditionally active Dwarf city
Playerbots.TeleToUndercityWeight = 10                                      # Medium: Active but manageable Undead city
Playerbots.TeleToShattrathCityWeight = 10                                  # Medium: Old TBC hub with moderate activity

# --- TIER 3: Quiet outer cities with slightly increased density ---
Playerbots.TeleToDarnassusWeight = 5                                       # Slightly increased: Night Elf city with basic activity
Playerbots.TeleToExodarWeight = 5                                          # Slightly increased: Draenei home city, less empty
Playerbots.TeleToThunderBluffWeight = 5                                    # Slightly increased: Tauren home city feels more alive
Playerbots.TeleToSilvermoonCityWeight = 5                                  # Slightly increased: Blood Elf metropolis with more activity

Playerbots.RandomBotRpgChance = 0.30                                       # Chance for idle roleplay actions in cities
Playerbots.RpgStatusProbWeight.TravelFlight = 20                           # Priority for flight travel
Playerbots.RpgStatusProbWeight.WanderNpc = 30                              # Priority for visiting vendors, bankers and other NPCs (module default: 20)
Playerbots.RpgStatusProbWeight.Rest = 15                                   # Priority for resting and idling (module default: 5)

# --- 10. QUESTS AND DUNGEONS (LFG) ---
Playerbots.AutoDoQuests = 1                                                # Bots accept and complete world quests automatically
Playerbots.SyncQuestWithPlayer = 1                                         # Syncs bot quest progress with the player
Playerbots.SyncQuestForPlayer = 1                                          # Syncs player quest progress with the bot
Playerbots.PreQuests = 0                                                   # Forces bots to respect prerequisite quests for instances/zones
Playerbots.RandomBotJoinLfg = 1                                            # Allows random bots to queue for Dungeon Finder (LFG)
Playerbots.RandomBotSuggestDungeons = 1                                    # Bots suggest suitable dungeons to the group leader
Playerbots.AutoLearnQuestSpells = 1                                        # Bots automatically learn quest-unlocked spells
Playerbots.AutoLearnTrainerSpells = 1                                      # Bots automatically learn all trainer spells

# --- 11. GUILDS, FACTIONS AND CLASS RESTRICTIONS ---
Playerbots.RandomBotAllianceRatio = 50                                     # Percentage of Alliance bots in the pool
Playerbots.RandomBotHordeRatio = 50                                        # Percentage of Horde bots in the pool
Playerbots.RandomBotGuildNearby = 0                                        # Creates guilds only near real players
Playerbots.RandomBotGuildCount = 50                                        # Maximum number of bot-only guilds on the realm
Playerbots.RandomBotGuildSizeMax = 50                                      # Maximum member count per bot guild
Playerbots.EnableGuildTasks = 1                                            # Enables the guild task system for bots
Playerbots.DisableDeathKnightLogin = 1                                     # Prevents Death Knight bots from logging in (1 = blocked)

# --- 12. ARENA AND PVP TEAMS ---
Playerbots.RandomBotArenaTeam2v2Count = 30                                 # Number of 2v2 arena teams to create
Playerbots.RandomBotArenaTeam3v3Count = 30                                 # Number of 3v3 arena teams to create
Playerbots.RandomBotArenaTeam5v5Count = 10                                 # Number of 5v5 arena teams to create
Playerbots.RandomBotArenaTeamMinRating = 0                                 # Minimum random start rating for bot arena teams
Playerbots.RandomBotArenaTeamMaxRating = 2000                              # Maximum random start rating for bot arena teams
Playerbots.RandomBotJoinBG = 1                                             # Allows random bots to join battlegrounds manually or via commands
Playerbots.RandomBotAutoJoinBG = 1                                         # Bots automatically join battlegrounds in the background when a BG starts

# --- 13. PERFORMANCE, TICK RATES AND NETWORK ---
Playerbots.IterationsPerTick = 1000                                        # Number of calculation steps per server tick per bot
Playerbots.MaxMovementSearchTime = 3                                       # Maximum pathfinding time in seconds
Playerbots.ReactDelay = 300                                                # Base bot reaction delay in combat, in milliseconds
Playerbots.DynamicReactDelay = 1                                           # Enables dynamic reaction delays based on server latency
Playerbots.PassiveDelay = 10000                                            # Delay for actions in passive mode, in milliseconds
Playerbots.RepeatDelay = 120000                                            # Delay for repeated checks, in milliseconds
Playerbots.CommandServerPort = 8888                                        # Network port for external bot control commands
Playerbots.PerfMonEnabled = 1                                              # Enables the bot performance monitoring tool
Playerbots.RandomBotRandomPassword = 1                                     # Generates random passwords for bot accounts
Playerbots.RandomBotAccountPrefix = "BOT_"                                 # Bot account prefix (module default "rndbot"). NEVER change once bot accounts exist

# --- 14. CHAT AND SOCIAL FEATURES ---
Playerbots.RandomBotTalk = 1                                               # Enables random bot speech in say, general or trade chat
Playerbots.RandomBotEmote = 1                                              # Random bot emotes such as waving or dancing (module default: off)
Playerbots.EnableGreet = 0                                                 # Bots greet players when invited
Playerbots.GuildRepliesRate = 10                                           # Chance in percent that bots chat in guild about events (default 100)
Playerbots.RandomBotSayWithoutMaster = 0                                   # Bots stay silent when traveling without a real player master

# --- 15. BROADCASTS ---
Playerbots.EnableBroadcasts = 1                                            # Enables or disables all automatic bot chat broadcasts
Playerbots.BroadcastChanceGuildManagement = 3000                           # Guild management messages; independent of the global chance below
Playerbots.BroadcastToWorldGlobalChance = 3000                             # World chat
Playerbots.BroadcastToGuildGlobalChance = 3000                             # Guild chat
Playerbots.BroadcastToGeneralGlobalChance = 3000                           # Local zone chat
Playerbots.BroadcastToTradeGlobalChance = 3000                             # Trade chat
Playerbots.BroadcastToLFGGlobalChance = 3000                               # LFG chat
Playerbots.BroadcastToLocalDefenseGlobalChance = 3000                      # Local defense
Playerbots.BroadcastToWorldDefenseGlobalChance = 3000                      # World defense
Playerbots.BroadcastToGuildRecruitmentGlobalChance = 3000                  # Guild recruitment

# --- 16. TIME INTERVALS AND BOT ROTATION ---
Playerbots.MaxWaitForMove = 5000                                           # Max wait in ms before a bot gives up a blocked move (module default)
Playerbots.GlobalCooldown = 500                                            # Artificial delay in milliseconds between bot spells
Playerbots.RandomBotUpdateInterval = 20                                    # Interval in seconds for general random bot pool updates (module default)
Playerbots.RandomBotCountChangeMinInterval = 600                           # Minimum time in seconds before bot count changes
Playerbots.RandomBotCountChangeMaxInterval = 1200                          # Maximum time in seconds before bot count changes
Playerbots.RandomBotCountMode = 1                                          # 0 = count rolled once at start, 1 = re-rolled every Change Min/MaxInterval, 2 = daily cycle
Playerbots.MinRandomBotRandomizeTime = 7200                                # Minimum time in seconds before bot properties are randomized again
Playerbots.MaxRandomBotRandomizeTime = 1209600                             # Maximum time in seconds before bot properties are randomized again
Playerbots.MinRandomBotTeleportInterval = 3600                             # Minimum time in seconds before an inactive bot teleports to a new location
Playerbots.MaxRandomBotTeleportInterval = 18000                            # Maximum time in seconds before an inactive bot must teleport
Playerbots.RandomBotsPerInterval = 12                                      # Number of bots logged in or out per interval
Playerbots.BotCheats = "food,raid,taxi"                                    # Enabled in-game cheats for bots
