# ==============================================================================
# AZEROTHCORE - AUTHSERVER CONFIG VALUES
# ------------------------------------------------------------------------------
# Curated summary of authserver.conf. Edit here, then "Apply values_auth.conf"
# in authmenu: every key below that also exists in authserver.conf is written
# there (a timestamped backup is made first). Unknown keys are skipped.
# ==============================================================================

# --- Network & binding ---
BindIP = "0.0.0.0"
RealmServerPort = 3724
EnableProxyProtocol = 0

# --- Database connection ---
# Format: "Host;Port;User;Password;DatabaseName"
LoginDatabaseInfo = "127.0.0.1;3306;acore;password;acore_auth"
LoginDatabase.WorkerThreads = 2
LoginDatabase.SynchThreads = 1

# --- Realm list ---
RealmsStateUpdateDelay = 15

# --- Console logging ---
Appender.Console = 1,6,1,"1 9 3 6 5 8"
